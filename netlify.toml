# Domain redirects (.in → .com)
[[redirects]]
  from = "https://insideinvoice.in/*"
  to = "https://insideinvoice.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://insideinvoice.in/*"
  to = "https://insideinvoice.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.insideinvoice.in/*"
  to = "https://insideinvoice.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.insideinvoice.in/*"
  to = "https://insideinvoice.com/:splat"
  status = 301
  force = true

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
